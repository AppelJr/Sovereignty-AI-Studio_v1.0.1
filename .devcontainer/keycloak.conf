# GATEONE Keycloak production configuration
# Domain: gateone.sovereignty.local (replace with your registered domain)
# Generated: 2026-10-08. Owner: AppelJr.

# Database (PostgreSQL for persistent sessions)
db=postgres
db-username=keycloak
db-password=${KC_DB_PASSWORD}
db-url=jdbc:postgresql://localhost/keycloak

# Observability
health-enabled=true
metrics-enabled=true

# HTTP / TLS
https-certificate-file=${kc.home.dir}/conf/server.crt.pem
https-certificate-key-file=${kc.home.dir}/conf/server.key.pem
proxy=reencrypt
spi-sticky-session-encoder-infinispan-should-attach-route=false

# Hostname (production — no longer a template)
hostname=gateone.sovereignty.local
http-enabled=false
https-port=8443

# GATEONE PQC authenticator
spi-authentication-authenticators-gateone-pqc-authenticator-verifier-url=https://gateone-verifier.sovereignty.local:8443/verify-attestation
spi-authentication-authenticators-gateone-pqc-authenticator-verifier-token=${GATEONE_VERIFIER_TOKEN}
spi-authentication-authenticators-gateone-pqc-authenticator-client-cert-path=${GATEONE_CLIENT_CERT_PATH}
spi-authentication-authenticators-gateone-pqc-authenticator-client-cert-password=${GATEONE_CLIENT_CERT_PASSWORD}
spi-authentication-authenticators-gateone-pqc-authenticator-ca-cert-path=${GATEONE_CA_CERT_PATH}
