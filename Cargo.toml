[workspace]
members = [
    "crates/principal",
    "crates/policy-engine",
    "crates/orchestrator",
    "phase0",
    "diamond-core",
]
[package]
name = "tulip-gate"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
resolver = "2"
