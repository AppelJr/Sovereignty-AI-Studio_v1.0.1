name: OAuth Generator
on:
  push:
    branches: [main, Collaboration, grok, 'xAI/Grok/**']
  pull_request:
    branches: [main, Collaboration, grok]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth-generator:
    name: OAuth Generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run OAuth generator dry-run
        run: python scripts/oauth_local_generator.py --dry-run
