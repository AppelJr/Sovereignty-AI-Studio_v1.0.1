name: Node Bridge CI

on:
  push:
    branches: [Collaboration]
    paths:
      - "node-bridge/**"
      - ".github/workflows/node-bridge.yml"
  pull_request:
    branches: [Collaboration]
    paths:
      - "node-bridge/**"
      - ".github/workflows/node-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-bridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-audit:
    name: Node 24 • install, security audit, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit with native git
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Set up Node.js 24 (action pinned to full commit SHA)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json

      - name: Verify runtime matches package engine
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major < 24) { console.error("FAIL: Node.js >=24 required"); process.exit(1); }'

      - name: Install exact lockfile without lifecycle scripts
        working-directory: node-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert patched qs version is installed
        working-directory: node-bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e 'const p=require("qs/package.json"); console.log("qs="+p.version); if (p.version !== "6.16.1") process.exit(1)'
          npm ls qs --all

      - name: Fail closed on moderate-or-higher npm advisories
        working-directory: node-bridge
        run: npm audit --audit-level=moderate

      - name: Run Node Bridge tests
        working-directory: node-bridge
        run: npm test
