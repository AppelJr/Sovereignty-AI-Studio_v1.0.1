name: Node Bridge CI

on:
  push:
    branches: [Collaboration]
    paths:
      - "node-bridge/**"
      - ".github/workflows/node-bridge.yml"
  pull_request:
    branches: [Collaboration]
    paths:
      - "node-bridge/**"
      - ".github/workflows/node-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-bridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-audit:
    name: Node 24 • install, security audit, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install exact lockfile without lifecycle scripts
        working-directory: node-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert patched qs version is installed
        working-directory: node-bridge
        run: |
          node -e 'const p=require("qs/package.json"); console.log("qs="+p.version); if (p.version !== "6.16.1") process.exit(1)'
          npm ls qs --all

      - name: Fail closed on moderate-or-higher npm advisories
        working-directory: node-bridge
        run: npm audit --audit-level=moderate

      - name: Run Node Bridge tests
        working-directory: node-bridge
        run: |
          echo "Starting Node Bridge tests at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm test
          echo "Node Bridge tests completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
