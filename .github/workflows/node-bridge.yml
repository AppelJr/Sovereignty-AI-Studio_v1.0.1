name: Node Bridge CI

on:
  push:
    branches: [Collaboration]
    paths:
      - "node-bridge/**"
      - ".github/workflows/node-bridge.yml"
  pull_request:
    branches: [Collaboration]
    paths:
      - "node-bridge/**"
      - ".github/workflows/node-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-bridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-audit:
    name: Node 24 • install, security audit, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit with native git
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Select preinstalled Node.js 24 (no third-party actions)
        shell: bash
        run: |
          set -Eeuo pipefail
          node24_bin=""
          for candidate in /opt/hostedtoolcache/node/24*/x64/bin; do
            if [[ -x "$candidate/node" && -x "$candidate/npm" ]]; then
              node24_bin="$candidate"
            fi
          done
          if [[ -z "$node24_bin" ]]; then
            echo "FAIL: hosted runner does not provide preinstalled Node.js 24" >&2
            exit 1
          fi
          echo "$node24_bin" >> "$GITHUB_PATH"
          export PATH="$node24_bin:$PATH"
          node --version
          npm --version
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) { console.error("FAIL: Node.js 24 required"); process.exit(1); }'

      - name: Install exact lockfile without lifecycle scripts
        working-directory: node-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert patched qs version is installed
        working-directory: node-bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e 'const p=require("qs/package.json"); console.log("qs="+p.version); if (p.version !== "6.16.1") process.exit(1)'
          npm ls qs --all

      - name: Fail closed on moderate-or-higher npm advisories
        working-directory: node-bridge
        run: npm audit --audit-level=moderate

      - name: Run Node Bridge tests
        working-directory: node-bridge
        run: npm test
