name: Diamond Lattice 5D Core v0.1

on:
  push:
    paths:
      - 'diamond-core/**'
      - '.github/workflows/Diamond_5D_Memory_Core.yml'
  pull_request:
    branches: [ "Collaboration", "main"]
    paths:
      - 'diamond-core/**'
      - '.github/workflows/Diamond_5D_Memory_Core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-core-v0.1-${{ github.ref }
  cancel-in-progress: false

jobs:
  contract:
    name: Diamond Core v0.1 Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without third-party actions
        env:
          GH_TOKEN: ${{ github.token }
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${{ github.repository }.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Runner contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.actions }" = true
          test "${{ runner.os }" = Linux
          case "${{ runner.arch }" in
            X64|ARM64) ;;
            *) echo "Unsupported runner architecture: ${{ runner.arch }"
            exit 1
            ;;
          case
          printf 'runner=%s/%s kernel=%s commit=%s\n' "${{ runner.os }" "${{ runner.arch }" "$(uname -m)" "${{ github.sha }"

      - name: Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Diamond Core tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f diamond-core/Cargo.toml
          cargo test --manifest-path diamond-core/Cargo.toml --all-targets

      - name: Contract certification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'DIAMOND_LATTICE_V0_1=PASS'
          echo "Validated commit: ${{ github.sha }"
