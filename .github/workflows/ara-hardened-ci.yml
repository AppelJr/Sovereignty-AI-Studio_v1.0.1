name: ara-hardened-unit-ci-local

# Explicit compatibility lane. The authoritative repository gate is
# .github/workflows/ci.yml. This workflow is intentionally visible on pushes
# and pull requests so failures are reported as normal checks.
on:
  workflow_dispatch:
  push:
    branches:
      - Claude
      - GPT/Codex
      - ara-hardened
      - copilot/main
      - Collaboration
      - duckAI
      - Devassist420
      - gate-wiring
  pull_request:
    branches:
      - Claude
      - GPT/Codex
      - ara-hardened
      - copilot/main
      - Collaboration
      - duckAI
      - Devassist420
      - gate-wiring

concurrency:
  group: ara-hardened-unit-ci-local-${{ github.workflow }}-${{ github.ref }
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci-local

jobs:
  light:
    name: Visible local coordination and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Startup verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.actions }}" = "true"
          test -n "${{ github.sha }}"
          echo "Running visible CI for ${{ github.repository }}@${{ github.sha }}"

      - name: Set up isolated Python
        shell: bash
        run: |
          set -Eeuo pipefail
          python_bin="$(command -v python3.13 || command -v python3)"
          "${python_bin}" -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "${{ github.path }}"
          python --version

      - name: Install minimal test tools
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip pytest

      - name: Coordination import check
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from backend.coordination import BranchRegistry

          registry = BranchRegistry()
          assert not registry.is_writable('main')
          assert not registry.is_writable('collaboration')
          assert registry.is_writable('ara-hardened')
          print('coordination OK')
          PY

      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: pytest -q prototypes/accessibility/tests/test_accessibility_control.py
