name: Ara

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420, "xAI/Grok/**"]
  pull_request:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  ara:
    name: Ara validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          if git config --get-regexp '^http\.extraheader$' >/dev/null 2>&1; then
            git config --unset-all http.extraheader
          fi
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
      - name: Validate first-party Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              Avatar_Companion_service.py|GitHub_TLS_pem.py)
                echo "SKIP (non-module dump): $file"
                continue
                ;;
            esac
            python3 -m py_compile "$file"
          done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.venv/**')
          echo 'Ara Python syntax validation: PASS'
      - name: Live ARA full audit (real GitHub API — no mocks)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ARA_CANONICAL_BRANCH: Collaboration
          ARA_RULESET_NAME: Ara
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 scripts/ara_full_audit.py
          status=$?
          set -e
          report="automation/reports/ara_full_audit.json"
          if [ -f "$report" ]; then
            echo "===== ARA REPORT (evidence) ====="
            cat "$report"
            echo "===== END ARA REPORT ====="
          else
            echo "ARA REPORT MISSING"
            exit 1
          fi
          exit "$status"
