name: Hardening Steps 14-16

on:
  push:
    branches:
      - hardening/steps-14-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-node-tests:
    name: Steps 14-16 Node hardening tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "CHECKOUT_OK=true"
          echo "COMMIT=${GITHUB_SHA}"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"

      - name: Verify Node runtime
        shell: bash
        run: node --version

      - name: Step 14 integration test
        shell: bash
        run: node tests/test_integration_pipeline.js

      - name: Step 15 TPM negative test
        shell: bash
        run: node tests/test_tpm_quote.js

      - name: Step 16 adversarial hardening test
        shell: bash
        run: node tests/test_adversarial_hardening.js
