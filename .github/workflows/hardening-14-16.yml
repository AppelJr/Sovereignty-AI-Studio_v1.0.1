name: Hardening Steps 14-16

on:
  push:
    branches:
      - hardening/steps-14-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-node-tests:
    name: Steps 14-16 Node hardening tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit (native git, full SHA, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${#GITHUB_SHA}" -eq 40
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "CHECKOUT_OK=true"
          echo "COMMIT=${GITHUB_SHA}"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"

      - name: Verify Node runtime
        shell: bash
        run: node --version

      - name: Step 14 integration test
        shell: bash
        run: node tests/test_integration_pipeline.js

      - name: Step 15 TPM negative test
        shell: bash
        run: node tests/test_tpm_quote.js

      - name: Step 16 adversarial hardening test
        shell: bash
        run: node tests/test_adversarial_hardening.js
