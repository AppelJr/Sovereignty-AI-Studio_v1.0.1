# =========================================================
# Sovereignty AI Studio — OAUTH API Generator
# Production CI/CD
# Zero-trust / fail-closed verification pipeline
# =========================================================
# Repository CI (GitHub Actions) — separate from device-local.
# All third-party actions pinned to full-length commit SHA.
# Mutable tags (@v5, @master) are policy violations.
# =========================================================
name: OAUTH-API-GENERATOR
on:
  push:
    branches:
      - main
      - Collaboration
  pull_request:
    branches:
      - main
      - Collaboration
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  # =======================================================
  # PYTHON + NODE BUILD / TEST
  # =======================================================
  build-test:
    name: Build / Test — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          python -m pip install flake8 pytest pytest-cov pip-audit
      - name: Validate Python syntax
        run: |
          python -m compileall -q apps backend src
      - name: Lint
        run: |
          flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
      - name: Run Python tests
        run: |
          pytest \
            --cov=apps \
            --cov=backend \
            --cov=src \
            --cov-report=xml \
            --strict-markers \
            -x \
            --tb=short
      - name: Dependency audit
        run: |
          python -m pip_audit \
            -r .github/workflows/Requirements.txt
          if [ -f requirements.txt ]; then
            python -m pip_audit \
              -r requirements.txt
          fi
      - name: Upload coverage
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"
          cache: npm
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          fi
      - name: Node syntax check
        run: |
          if [ -f node-bridge/server.js ]; then
            node --check node-bridge/server.js
          fi
          if [ -f unified_server.js ]; then
            node --check unified_server.js
          fi
  # =======================================================
  # SECURITY SCAN
  # =======================================================
  security-scan:
    name: Security Scan
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Python dependency audit
        run: |
          if [ -f requirements.txt ]; then
            python -m pip_audit -r requirements.txt
          fi
          if [ -f .github/workflows/Requirements.txt ]; then
            python -m pip_audit -r .github/workflows/Requirements.txt
          fi
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
  # =======================================================
  # CONTAINER BUILD + SIGNING
  # =======================================================
  build-sign:
    name: Build / Sign Multi-Arch Image
    needs:
      - build-test
      - security-scan
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
            ${{ env.REGISTRY_LC }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${REGISTRY_LC}:${GITHUB_SHA}"
  # =======================================================
  # SBOM + SUPPLY CHAIN ATTESTATION
  # =======================================================
  supply-chain:
    name: SBOM / Supply Chain Attestation
    needs: build-sign
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Compute image name
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@9f7302141466aa6482940f15371237e9d9f4c34a # v0.19.0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
      - name: Verify SBOM exists
        shell: bash
        run: |
          set -euo pipefail
          test -s sbom-sovereignty-ai.json
      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign attest \
            --yes \
            --predicate sbom-sovereignty-ai.json \
            --type cyclonedx \
            "${REGISTRY_LC}:${GITHUB_SHA}"
  # =======================================================
  # FINAL VERIFICATION
  # =======================================================
  verify:
    name: Final Release Verification
    needs:
      - build-test
      - security-scan
      - build-sign
      - supply-chain
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required jobs succeeded
        shell: bash
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          BUILD_SIGN: ${{ needs.build-sign.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        run: |
          set -euo pipefail
          echo "build-test=${BUILD_TEST}"
          echo "security-scan=${SECURITY_SCAN}"
          echo "build-sign=${BUILD_SIGN}"
          echo "supply-chain=${SUPPLY_CHAIN}"
          test "${BUILD_TEST}" = "success"
          test "${SECURITY_SCAN}" = "success"
          if [[ "${{ github.event_name }}" == "release" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            test "${BUILD_SIGN}" = "success"
            test "${SUPPLY_CHAIN}" = "success"
          fi
          echo "Verification completed successfully."
# =========================================================
# IMPORTANT
# =========================================================
# CI success ≠ production certification.
# Device-local ≠ repository CI.
# PQC signing is not claimed by this workflow.
# =========================================================
