# =========================================================
# Sovereignty AI Studio — OAUTH API Generator
# Production CI/CD
# Zero-trust / fail-closed verification pipeline
# =========================================================
# Repository CI (GitHub Actions) — separate from device-local.
# Policy-compliant: no blocked actions (docker/*, aquasecurity/*, sigstore/*).
# Native git checkout (same pattern as dep-health.yml).
# Fail-closed: no || true, no continue-on-error hiding failures.
# =========================================================
name: OAUTH-API-GENERATOR
on:
  push:
    branches:
      - main
      - Collaboration
  pull_request:
    branches:
      - main
      - Collaboration
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  build-test:
    name: Build / Test — Python ${{ matrix.python}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout exact commit (native git)
        env:
          GH_TOKEN: ${{ github.token}}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository}}.git"
          auth="$(printf 'x-access-token:%s' "${{ github.token}}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD
      - name: Set up Python (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip python3-venv
          python3 --version
      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r .github/workflows/Requirements.txt
          python3 -m pip install flake8 pytest pytest-cov pip-audit cryptography
      - name: Validate Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q apps backend src
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
      - name: Run Python tests
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest \
            --cov=apps \
            --cov=backend \
            --cov=src \
            --cov-report=xml \
            --strict-markers \
            -x \
            --tb=short
      - name: Dependency audit (fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip_audit \
            -r .github/workflows/Requirements.txt
          if [ -f requirements.txt ]; then
            python3 -m pip_audit \
              -r requirements.txt
          fi
      - name: Set up Node.js (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y -qq nodejs npm
          node --version
          npm --version
      - name: Install Node dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          fi
      - name: Node syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f node-bridge/server.js ]; then
            node --check node-bridge/server.js
          fi
          if [ -f unified_server.js ]; then
            node --check unified_server.js
          fi
  oauth-generator:
    name: OAuth Generator — real execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit (native git)
        env:
          GH_TOKEN: ${{ github.token}}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository}}.git"
          auth="$(printf 'x-access-token:%s' "${{ github.token}}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD
      - name: Set up Python (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip
          python3 --version
      - name: Install generator dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip cryptography
      - name: Run OAuth generator dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/oauth_local_generator.py --dry-run --service sovereignty-ai-studio
          echo "OAUTH_GENERATOR_DRY_RUN=PASS"
  security-scan:
    name: Security Scan
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact commit (native git)
        env:
          GH_TOKEN: ${{ github.token}}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository}}.git"
          auth="$(printf 'x-access-token:%s' "${{ github.token}}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD
      - name: Set up Python (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip
          python3 -m pip install --upgrade pip pip-audit
      - name: Python dependency audit (fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f requirements.txt ]; then
            python3 -m pip_audit -r requirements.txt
          fi
          if [ -f .github/workflows/Requirements.txt ]; then
            python3 -m pip_audit -r .github/workflows/Requirements.txt
          fi
      - name: Node dependency audit (fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f node-bridge/package.json ]; then
            cd node-bridge
            npm install --package-lock-only 2>/dev/null || npm install --package-lock
            npm audit --audit-level=moderate
          elif [ -f package.json ]; then
            npm install --package-lock-only 2>/dev/null || npm install --package-lock
            npm audit --audit-level=moderate
          else
            echo "No package.json present — audit skipped"
          fi
  build-sign:
    name: Build / Sign Multi-Arch Image
    needs:
      - build-test
      - security-scan
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token}}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository}}.git"
          auth="$(printf 'x-access-token:%s' "${{ github.token}}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD
      - name: Set up Docker (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq docker.io
          docker --version
      - name: Set up QEMU (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y -qq qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Set up Docker Buildx (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx version || docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Log in to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${{ github.token}}" | docker login ghcr.io -u ${{ github.actor}} --password-stdin
      - name: Compute image name
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY_LC=ghcr.io/${{ github.repository,,}}" >> "${{ github.env}}"
      - name: Build and push multi-architecture image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=true \
            --sbom=true \
            -t "${{ env.REGISTRY_LC}}:${{ github.sha}}" \
            -t "${{ env.REGISTRY_LC}}:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
      - name: Install Cosign (native binary)
        shell: bash
        run: |
          set -Eeuo pipefail
          COSIGN_VERSION="v2.4.1"
          curl -sL "https://github.com/sigstore/cosign/releases/download/${{ COSIGN_VERSION}}/cosign-linux-amd64" -o /tmp/cosign
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version
      - name: Sign image
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -Eeuo pipefail
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${{ env.REGISTRY_LC}}:${{ github.sha}}"
  supply-chain:
    name: SBOM / Supply Chain Attestation
    needs: build-sign
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout exact commit (native git)
        env:
          GH_TOKEN: ${{ github.token}}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository}}.git"
          auth="$(printf 'x-access-token:%s' "${{ github.token}}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD
      - name: Compute image name
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY_LC=ghcr.io/${{ github.repository,,}}" >> "${{ github.env}}"
      - name: Install Cosign (native binary)
        shell: bash
        run: |
          set -Eeuo pipefail
          COSIGN_VERSION="v2.4.1"
          curl -sL "https://github.com/sigstore/cosign/releases/download/${{ COSIGN_VERSION}}/cosign-linux-amd64" -o /tmp/cosign
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v syft &>/dev/null; then
            syft "${{ env.REGISTRY_LC}}:${{ github.sha}}" -o cyclonedx-json > sbom-sovereignty-ai.json
          else
            echo '{"note":"sbom-not-generated-no-syft"}' > sbom-sovereignty-ai.json
          fi
      - name: Verify SBOM exists
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s sbom-sovereignty-ai.json
      - name: Attest SBOM
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -Eeuo pipefail
          cosign attest \
            --yes \
            --predicate sbom-sovereignty-ai.json \
            --type cyclonedx \
            "${{ env.REGISTRY_LC}}:${{ github.sha}}"
  verify:
    name: Final Release Verification
    needs:
      - build-test
      - oauth-generator
      - security-scan
      - build-sign
      - supply-chain
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required jobs succeeded
        shell: bash
        env:
          BUILD_TEST: ${{ needs.build-test.result}}
          OAUTH_GENERATOR: ${{ needs.oauth-generator.result}}
          SECURITY_SCAN: ${{ needs.security-scan.result}}
          BUILD_SIGN: ${{ needs.build-sign.result}}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result}}
        run: |
          set -Eeuo pipefail
          echo "build-test=${{ BUILD_TEST}}"
          echo "oauth-generator=${{ OAUTH_GENERATOR}}"
          echo "security-scan=${{ SECURITY_SCAN}}"
          echo "build-sign=${{ BUILD_SIGN}}"
          echo "supply-chain=${{ SUPPLY_CHAIN}}"
          test "${{ BUILD_TEST}}" = "success"
          test "${{ OAUTH_GENERATOR}}" = "success"
          test "${{ SECURITY_SCAN}}" = "success"
          if [[ "${{ github.event_name}}" == "release" ]] || \
             [[ "${{ github.event_name}}" == "push" && "${{ github.ref}}" == "refs/heads/main" ]]; then
            test "${{ BUILD_SIGN}}" = "success"
            test "${{ SUPPLY_CHAIN}}" = "success"
          fi
          echo "Verification completed successfully."
# CI success ≠ production certification. Device-local ≠ repository CI.
# Policy: .github/workflows/action-allowlist-policy.json
