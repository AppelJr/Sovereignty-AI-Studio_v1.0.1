# =========================================================
# OAUTH API GENERATOR – CI/CD PIPELINE
# =========================================================
# Production-grade, zero-trust, supply-chain verified
# deployment pipeline for Sovereignty AI Studio
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
    branches: [ "main", "Collaboration", "Grok", "ara-hardened", "GPT/Codex" ]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/Sovereign-OAuth-Generator.yaml"
      - ".github/workflows/action-allowlist-policy.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches: [ "main", "Collaboration" ]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/Sovereign-OAuth-Generator.yaml"
      - ".github/workflows/action-allowlist-policy.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./services:./core
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:

  # =========================================================
  # ALLOWLIST GATE - enforce policy against all workflows
  # =========================================================
  allowlist-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Enforce action allowlist policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          policy = json.loads(pathlib.Path(".github/workflows/action-allowlist-policy.json").read_text())
          blocked_patterns = [b["action"] for b in policy["blocked"]]
          approved = {a["action"] for a in policy["approved"]}
          wf_dir = pathlib.Path(".github/workflows")
          violations = []
          for wf in sorted(wf_dir.glob("*.y*ml")):
              text = wf.read_text(encoding="utf-8")
              for i, line in enumerate(text.splitlines(), 1):
                  m = re.match(r"\s*-\s*uses:\s*(.+)$", line)
                  if not m:
                      continue
                  action = m.group(1).strip().strip('"').strip("'")
                  action_name = action.split("@")[0]
                  blocked = False
                  for pat in blocked_patterns:
                      if pat.endswith("/*"):
                          if action_name.startswith(pat[:-2]):
                              blocked = True
                              break
                      elif action_name == pat:
                          blocked = True
                          break
                  if blocked:
                      reason = next((b["reason"] for b in policy["blocked"] if (b["action"].endswith("/*") and action_name.startswith(b["action"][:-2])) or b["action"] == action_name), "blocked by policy")
                      violations.append(f"{wf.name}:{i}: BLOCKED action '{action}' - {reason}")
                  elif action_name not in approved and "/" in action_name:
                      print(f"::warning file={wf.name},line={i}::UNKNOWN third-party action '{action}' - not on approved list. Owner should review and add to allowlist or blocklist.")
          if violations:
              print("ALLOWLIST VIOLATIONS:")
              for v in violations:
                  print(" ", v)
              sys.exit(1)
          print("ALLOWLIST GATE PASS - no blocked actions in workflows")
          PY

  # =========================================================
  # LINT + TEST (Python) - native git + system python
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      matrix:
        python: [ '3.13' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r .github/workflows/Requirements.txt
          pip install flake8 safety

      - name: Lint with flake8
        run: flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Python tests
        env:
          PYTHONPATH: .:./backend
        run: pytest --cov=apps --cov=backend --cov=src --cov-report=xml --strict-markers -x --tb=short

      - name: Dependency safety check
        run: |
          safety check -r .github/workflows/Requirements.txt --output text
          safety check -r requirements.txt --output text
        continue-on-error: false

      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Node syntax check
        run: |
          node -c node-bridge/server.js
          node -c unified_server.js

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    needs: build-test
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        shell: bash
        run: |
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_LC }}:latest
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (Keyless — Fulcio + Rekor)
        run: |
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # =========================================================
  # SBOM GENERATION + ATTESTATION
  # =========================================================
  supply-chain:
    needs: build-sign
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        shell: bash
        run: |
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign SBOM Attestation
        run: |
          cosign attest \
            --predicate sbom-sovereignty-ai.json \
            --type cyclonedx \
            --yes \
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1
        continue-on-error: false

  # =========================================================
  # SECURITY SCANNING
  # =========================================================
  security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: OWASP dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt 
        continue-on-error: false

# =========================================================
# SECURITY HARDENING HEADERS (enforced in nginx + FastAPI)
# =========================================================
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# X-XSS-Protection: 1; mode=block
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()

# =========================================================
# CRYPTO STACK (implemented in security_backend.py)
# =========================================================
# - HMAC-SHA3-512 (token signing, Dilithium3 shim)
# - Argon2id (KDF for passphrase hashing — planned)
# - BLAKE3 hashing (audit integrity — planned)
# - ChaCha20-Poly1305 (AEAD encryption — planned)
# - ML-DSA / Falcon (PQ signatures — planned)
# - ML-KEM (Kyber key exchange — planned)
