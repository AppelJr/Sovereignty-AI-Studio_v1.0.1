# =========================================================
# Sovereignty AI Studio — OAUTH API Generator
# Production CI/CD
# Zero-trust / fail-closed verification pipeline
# =========================================================
# Repository CI runs on GitHub Actions (not the owner device).
# Device-local execution is a separate surface.
# This workflow must actually run — no silent green, no fake skip.
# =========================================================
name: OAUTH-API-GENERATOR
on:
  push:
    branches:
      - main
      - Collaboration
  pull_request:
    branches:
      - main
      - Collaboration
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  # =======================================================
  # PYTHON + NODE BUILD / TEST
  # =======================================================
  build-test:
    name: Build / Test — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/workflows/Requirements.txt
          python -m pip install flake8 pytest pytest-cov pip-audit
      - name: Validate Python syntax
        run: |
          python -m compileall -q apps backend src
      - name: Lint
        run: |
          flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
      - name: Run Python tests
        run: |
          pytest \
            --cov=apps \
            --cov=backend \
            --cov=src \
            --cov-report=xml \
            --strict-markers \
            -x \
            --tb=short
      - name: Dependency audit
        run: |
          python -m pip_audit \
            -r .github/workflows/Requirements.txt
          if [ -f requirements.txt ]; then
            python -m pip_audit \
              -r requirements.txt
          fi
      - name: Upload coverage
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: npm
      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f package.json ]; then
            npm install --ignore-scripts
          fi
      - name: Node syntax check
        run: |
          if [ -f node-bridge/server.js ]; then
            node --check node-bridge/server.js
          fi
          if [ -f unified_server.js ]; then
            node --check unified_server.js
          fi
  # =======================================================
  # SECURITY SCAN
  # =======================================================
  security-scan:
    name: Security Scan
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Python dependency audit
        run: |
          if [ -f requirements.txt ]; then
            python -m pip_audit -r requirements.txt
          fi
          if [ -f .github/workflows/Requirements.txt ]; then
            python -m pip_audit -r .github/workflows/Requirements.txt
          fi
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
  # =======================================================
  # CONTAINER BUILD + SIGNING
  # =======================================================
  build-sign:
    name: Build / Sign Multi-Arch Image
    needs:
      - build-test
      - security-scan
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY_LC }}:${{ github.sha }}
            ${{ env.REGISTRY_LC }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${REGISTRY_LC}:${GITHUB_SHA}"
  # =======================================================
  # SBOM + SUPPLY CHAIN ATTESTATION
  # =======================================================
  supply-chain:
    name: SBOM / Supply Chain Attestation
    needs: build-sign
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute image name
        shell: bash
        run: |
          set -euo pipefail
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY_LC }}:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-sovereignty-ai.json
      - name: Verify SBOM exists
        shell: bash
        run: |
          set -euo pipefail
          test -s sbom-sovereignty-ai.json
      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign attest \
            --yes \
            --predicate sbom-sovereignty-ai.json \
            --type cyclonedx \
            "${REGISTRY_LC}:${GITHUB_SHA}"
  # =======================================================
  # FINAL VERIFICATION
  # =======================================================
  verify:
    name: Final Release Verification
    needs:
      - build-test
      - security-scan
      - build-sign
      - supply-chain
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required jobs succeeded
        shell: bash
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          BUILD_SIGN: ${{ needs.build-sign.result }}
          SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        run: |
          set -euo pipefail
          echo "build-test=${BUILD_TEST}"
          echo "security-scan=${SECURITY_SCAN}"
          echo "build-sign=${BUILD_SIGN}"
          echo "supply-chain=${SUPPLY_CHAIN}"
          test "${BUILD_TEST}" = "success"
          test "${SECURITY_SCAN}" = "success"
          if [[ "${{ github.event_name }}" == "release" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            test "${BUILD_SIGN}" = "success"
            test "${SUPPLY_CHAIN}" = "success"
          fi
          echo "Verification completed successfully."
# =========================================================
# SECURITY HEADERS
# =========================================================
#
# Enforced by the application / reverse proxy:
#
# Strict-Transport-Security:
#   max-age=31536000; includeSubDomains; preload
#
# Content-Security-Policy:
#   default-src 'self'; script-src 'self'
#
# X-Content-Type-Options:
#   nosniff
#
# X-Frame-Options:
#   DENY
#
# Referrer-Policy:
#   strict-origin-when-cross-origin
#
# Permissions-Policy:
#   camera=(), microphone=(), geolocation=()
#
# =========================================================
# CRYPTOGRAPHIC ROADMAP
# =========================================================
#
# Implemented / verified:
#   HMAC-SHA3-512
#
# Planned / must not be represented as implemented:
#   Argon2id
#   BLAKE3 audit hashing
#   ChaCha20-Poly1305
#   ML-DSA
#   Falcon
#   ML-KEM
#   Merkle audit log
#   TSA timestamping
#
# =========================================================
# IMPORTANT
# =========================================================
#
# CI success is not equivalent to production certification.
#
# Supply-chain signing currently uses Sigstore keyless
# signing (Fulcio + Rekor).
#
# PQC signing is not claimed by this workflow.
#
# Compliance labels are not certification claims.
#
# Device-local execution is a separate surface from this
# repository CI pipeline. They must not be conflated.
# =========================================================
