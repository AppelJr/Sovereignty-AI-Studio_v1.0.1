# =========================================================
# Sovereignty AI Studio — OAUTH API Generator
# Production CI/CD
# Zero-trust / fail-closed verification pipeline
# =========================================================
# Repository CI (GitHub Actions) — separate from device-local.
# Policy-compliant: no blocked actions (docker/*, aquasecurity/*, sigstore/*).
# Native git checkout (same pattern as dep-health.yml).
# Fail-closed: no || true, no continue-on-error hiding failures.
# Real results only: no echo-based fake verification.
# =========================================================
name: OAUTH-API-GENERATOR
on:
  push:
    branches:
      - main
      - Collaboration
      - grok
  pull_request:
    branches:
      - main
      - Collaboration
      - grok
  release:
    types:
      - published
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  build-test:
    name: Build / Test — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.13"
    steps:
      - name: Checkout commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git rev-parse --short HEAD
      - name: Set up Python (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip python3-venv
          python3 --version
      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip
          if [ -f .github/workflows/Requirements.txt ]; then python3 -m pip install -r .github/workflows/Requirements.txt; fi
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi
          python3 -m pip install flake8 pytest pytest-cov pip-audit cryptography
      - name: Validate Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q apps backend src
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
      - name: Run Python tests
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest \
            --cov=apps \
            --cov=backend \
            --cov=src \
            --cov-report=xml \
            --strict-markers \
            -x \
            --tb=short
      - name: Dependency audit (fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip_audit \
            -r .github/workflows/Requirements.txt
          if [ -f requirements.txt ]; then
            python3 -m pip_audit \
              -r requirements.txt
          fi
  oauth-generator:
    name: OAuth Generator — real execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit (native git)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git rev-parse --short HEAD
      - name: Set up Python (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip
          python3 --version
      - name: Install generator dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip cryptography
      - name: Run OAuth generator dry-run
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/oauth_local_generator.py --dry-run --service sovereignty-ai-studio
  security-scan:
    name: Security Scan
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git rev-parse --short HEAD
      - name: Set up Python (system)
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip
          python3 -m pip install --upgrade pip pip-audit
      - name: Python dependency audit (fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f requirements.txt ]; then
            python3 -m pip_audit -r requirements.txt
          fi
          if [ -f .github/workflows/Requirements.txt ]; then
            python3 -m pip_audit -r .github/workflows/Requirements.txt
          fi
      - name: Node dependency audit (fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f node-bridge/package.json ]; then
            cd node-bridge
            npm install --package-lock-only
            npm audit --audit-level=moderate
          elif [ -f package.json ]; then
            npm install --package-lock-only
            npm audit --audit-level=moderate
          else
            echo "No package.json present — audit skipped"
          fi
# CI success ≠ production certification. Device-local ≠ repository CI.
# Policy: .github/workflows/action-allowlist-policy.json
