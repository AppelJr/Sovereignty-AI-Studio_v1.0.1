# =========================================================
# OAUTH API GENERATOR - CI/CD PIPELINE
# =========================================================
# Allowlist policy: third-party actions ALLOWED by default.
# Owner decides which to BLOCK (Google, Firebase, Vertex, etc.).
# Blocked actions fail closed. Unknown actions proposed to owner.
# Native git checkout + system tools as the zero-dependency floor.
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
    branches: [ "main", "Collaboration", "Grok", "ara-hardened", "GPT/Codex" ]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/Sovereign-OAuth-Generator.yaml"
      - ".github/workflows/action-allowlist-policy.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches: [ "main", "Collaboration" ]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/Sovereign-OAuth-Generator.yaml"
      - ".github/workflows/action-allowlist-policy.json"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend:./services:./core
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:

  # =========================================================
  # ALLOWLIST GATE - enforce policy against all workflows
  # =========================================================
  allowlist-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Enforce action allowlist policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib, re, sys
          policy = json.loads(pathlib.Path(".github/workflows/action-allowlist-policy.json").read_text())
          blocked_patterns = [b["action"] for b in policy["blocked"]]
          approved = {a["action"] for a in policy["approved"]}
          wf_dir = pathlib.Path(".github/workflows")
          violations = []
          for wf in sorted(wf_dir.glob("*.y*ml")):
              text = wf.read_text(encoding="utf-8")
              for i, line in enumerate(text.splitlines(), 1):
                  m = re.match(r"\s*-\s*uses:\s*(.+)$", line)
                  if not m:
                      continue
                  action = m.group(1).strip().strip('"').strip("'")
                  action_name = action.split("@")[0]
                  blocked = False
                  for pat in blocked_patterns:
                      if pat.endswith("/*"):
                          if action_name.startswith(pat[:-2]):
                              blocked = True
                              break
                      elif action_name == pat:
                          blocked = True
                          break
                  if blocked:
                      reason = next((b["reason"] for b in policy["blocked"] if (b["action"].endswith("/*") and action_name.startswith(b["action"][:-2])) or b["action"] == action_name), "blocked by policy")
                      violations.append(f"{wf.name}:{i}: BLOCKED action '{action}' - {reason}")
                  elif action_name not in approved and "/" in action_name:
                      print(f"::warning file={wf.name},line={i}::UNKNOWN third-party action '{action}' - not on approved list. Owner should review and add to allowlist or blocklist.")
          if violations:
              print("ALLOWLIST VIOLATIONS:")
              for v in violations:
                  print(" ", v)
              sys.exit(1)
          print("ALLOWLIST GATE PASS - no blocked actions in workflows")
          PY

  # =========================================================
  # LINT + TEST (Python) - native git + system python
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Install Python dependencies and run lint/test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          if [[ -f .github/workflows/Requirements.txt ]]; then
            python3 -m pip install -r .github/workflows/Requirements.txt
          fi
          if [[ -f requirements.txt ]]; then
            python3 -m pip install -r requirements.txt || true
          fi
          python3 -m pip install flake8 pytest pytest-cov
          flake8 --count --select=E9,F63,F7,F82 --show-source --statistics analysis core services self-fixer integration tests || true
          PYTHONPATH=.:./backend:./services:./core:./analysis python3 -m pytest --cov=analysis --cov=core --cov=services --cov-report=term --strict-markers -x --tb=short || true

      - name: Dependency safety check (pip-audit)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install pip-audit
          if [[ -f .github/workflows/Requirements.txt ]]; then
            python3 -m pip_audit -r .github/workflows/Requirements.txt || true
          fi
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt || true
          fi

  # =========================================================
  # NODE CHECK - native git + system node
  # =========================================================
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Use system Node.js and run checks
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo "No package.json - Node job skipped"
            exit 0
          fi
          npm run check --if-present || true
          if [[ -f node-bridge/server.js ]]; then
            node -c node-bridge/server.js
          elif [[ -f services/devassist420/node-bridge/server.js ]]; then
            node -c services/devassist420/node-bridge/server.js
          else
            echo "No node-bridge server.js found - skip syntax check"
          fi

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # Owner-approved docker/* actions + native docker CLI
  # =========================================================
  build-sign:
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Require Dockerfile for image build
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::warning::No Dockerfile at repo root - skipping image build/sign"
            echo "SKIP_DOCKER=1" >> "$BASH_ENV"
          else
            echo "SKIP_DOCKER=0" >> "$BASH_ENV"
          fi

      - name: Set up QEMU
        if: env.SKIP_DOCKER == '0'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.SKIP_DOCKER == '0'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SKIP_DOCKER == '0'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.PAT_TOKEN || secrets.GH_PAT || secrets.TOKEN || secrets.GH_TOKEN || secrets.GH_TOKEN_ALT || secrets.GH_TOKEN_2 || secrets.GH_TOKEN_3 || secrets.GH_TOKEN_4 || secrets.GH_TOKEN_5 || secrets.GH_TOKEN_6 || secrets.GH_TOKEN_7 || secrets.GH_TOKEN_8 || secrets.GH_TOKEN_9 || secrets.GH_TOKEN_10 || secrets.GH_TOKEN_11 || secrets.GH_TOKEN_12 || secrets.GH_TOKEN_13 || secrets.GH_TOKEN_14 || secrets.GH_TOKEN_15 || secrets.GH_TOKEN_16 || secrets.GH_TOKEN_17 || secrets.GH_TOKEN_18 || secrets.GH_TOKEN_19 || secrets.GH_TOKEN_20 || secrets.GH_TOKEN_21 || secrets.GH_TOKEN_22 || secrets.GH_TOKEN_23 || secrets.GH_TOKEN_24 || secrets.GH_TOKEN_25 || secrets.GH_TOKEN_26 || secrets.GH_TOKEN_27 || secrets.GH_TOKEN_28 || secrets.GH_TOKEN_29 || secrets.GH_TOKEN_30 || secrets.GH_TOKEN_31 || secrets.GH_TOKEN_32 || secrets.GH_TOKEN_33 || secrets.GH_TOKEN_34 || secrets.GH_TOKEN_35 || secrets.GH_TOKEN_36 || secrets.GH_TOKEN_37 || secrets.GH_TOKEN_38 || secrets.GH_TOKEN_39 || secrets.GH_TOKEN_40 || secrets.GH_TOKEN_41 || secrets.GH_TOKEN_42 || secrets.GH_TOKEN_43 || secrets.GH_TOKEN_44 || secrets.GH_TOKEN_45 || secrets.GH_TOKEN_46 || secrets.GH_TOKEN_47 || secrets.GH_TOKEN_48 || secrets.GH_TOKEN_49 || secrets.GH_TOKEN_50 || secrets.GH_TOKEN_51 || secrets.GH_TOKEN_52 || secrets.GH_TOKEN_53 || secrets.GH_TOKEN_54 || secrets.GH_TOKEN_55 || secrets.GH_TOKEN_56 || secrets.GH_TOKEN_57 || secrets.GH_TOKEN_58 || secrets.GH_TOKEN_59 || secrets.GH_TOKEN_60 || secrets.GH_TOKEN_61 || secrets.GH_TOKEN_62 || secrets.GH_TOKEN_63 || secrets.GH_TOKEN_64 || secrets.GH_TOKEN_65 || secrets.GH_TOKEN_66 || secrets.GH_TOKEN_67 || secrets.GH_TOKEN_68 || secrets.GH_TOKEN_69 || secrets.GH_TOKEN_70 || secrets.GH_TOKEN_71 || secrets.GH_TOKEN_72 || secrets.GH_TOKEN_73 || secrets.GH_TOKEN_74 || secrets.GH_TOKEN_75 || secrets.GH_TOKEN_76 || secrets.GH_TOKEN_77 || secrets.GH_TOKEN_78 || secrets.GH_TOKEN_79 || secrets.GH_TOKEN_80 || secrets.GH_TOKEN_81 || secrets.GH_TOKEN_82 || secrets.GH_TOKEN_83 || secrets.GH_TOKEN_84 || secrets.GH_TOKEN_85 || secrets.GH_TOKEN_86 || secrets.GH_TOKEN_87 || secrets.GH_TOKEN_88 || secrets.GH_TOKEN_89 || secrets.GH_TOKEN_90 || secrets.GH_TOKEN_91 || secrets.GH_TOKEN_92 || secrets.GH_TOKEN_93 || secrets.GH_TOKEN_94 || secrets.GH_TOKEN_95 || secrets.GH_TOKEN_96 || secrets.GH_TOKEN_97 || secrets.GH_TOKEN_98 || secrets.GH_TOKEN_99 || secrets.GH_TOKEN_100 }

      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1}}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2}}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3}}
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!