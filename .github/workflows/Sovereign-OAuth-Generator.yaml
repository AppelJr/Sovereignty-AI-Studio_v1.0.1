# =========================================================
# Sovereignty AI Studio — OAUTH API Generator
# Production CI/CD
# Zero-trust / fail-closed verification pipeline
# =========================================================
# Org policy: only AppelJr-owned actions pinned to full SHA.
# This workflow uses ZERO third-party actions.
# Native git checkout + system python3/node/docker only.
# =========================================================
name: OAUTH-API-GENERATOR

on:
  push:
    branches:
      - main
      - Collaboration
  pull_request:
    branches:
      - main
      - Collaboration
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  # =======================================================
  # PYTHON + NODE BUILD / TEST
  # =======================================================
  build-test:
    name: Build / Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          if [[ -f .github/workflows/Requirements.txt ]]; then
            python3 -m pip install -r .github/workflows/Requirements.txt
          fi
          if [[ -f requirements.txt ]]; then
            python3 -m pip install -r requirements.txt
          fi
          python3 -m pip install flake8 pytest pytest-cov pip-audit

      - name: Validate Python syntax
        run: |
          set -Eeuo pipefail
          for d in apps backend src analysis core services; do
            if [[ -d "$d" ]]; then
              python3 -m compileall -q "$d"
            fi
          done

      - name: Lint
        run: |
          set -Eeuo pipefail
          flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            apps backend src analysis core services 2>/dev/null || \
          flake8 \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Run Python tests
        run: |
          set -Eeuo pipefail
          PYTHONPATH=.:./backend:./services:./core:./analysis \
            python3 -m pytest \
              --cov=apps \
              --cov=backend \
              --cov=src \
              --cov-report=term \
              --strict-markers \
              -x \
              --tb=short \
              || PYTHONPATH=.:./backend python3 -m pytest --strict-markers -x --tb=short

      - name: Dependency audit (pip-audit, fail-closed)
        run: |
          set -Eeuo pipefail
          if [[ -f .github/workflows/Requirements.txt ]]; then
            python3 -m pip_audit -r .github/workflows/Requirements.txt
          fi
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt
          fi

      - name: Node syntax check (system node)
        run: |
          set -Eeuo pipefail
          node --version || true
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          elif [[ -f package.json ]]; then
            npm install --ignore-scripts
          fi
          if [[ -f node-bridge/server.js ]]; then
            node --check node-bridge/server.js
          fi
          if [[ -f unified_server.js ]]; then
            node --check unified_server.js
          fi
          if [[ -f package.json ]] || [[ -f node-bridge/package.json ]]; then
            if [[ -f node-bridge/package.json ]]; then
              (cd node-bridge && npm audit --audit-level=high)
            else
              npm audit --audit-level=high
            fi
          fi

  # =======================================================
  # SECURITY SCAN (native tools only)
  # =======================================================
  security-scan:
    name: Security Scan
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Python dependency audit (fail-closed)
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade pip pip-audit
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt
          fi
          if [[ -f .github/workflows/Requirements.txt ]]; then
            python3 -m pip_audit -r .github/workflows/Requirements.txt
          fi

      - name: Filesystem CVE scan via pip-audit / npm (no trivy action)
        run: |
          set -Eeuo pipefail
          echo "Third-party trivy-action blocked by org policy."
          echo "Using native pip-audit + npm audit only."
          if [[ -f package.json ]]; then
            npm audit --audit-level=high || true
          fi
          echo "Security scan step completed with native tools."

  # =======================================================
  # CONTAINER BUILD + SIGN (native docker CLI, main/release)
  # =======================================================
  build-sign:
    name: Build / Sign Image
    needs:
      - build-test
      - security-scan
    if: >
      github.event_name == 'release' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Require Dockerfile
        id: docker
        run: |
          set -Eeuo pipefail
          if [[ ! -f Dockerfile ]]; then
            echo "No Dockerfile at repo root — skipping image build/sign"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (native docker)
        if: steps.docker.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push image (native docker)
        if: steps.docker.outputs.skip == '0'
        run: |
          set -Eeuo pipefail
          REGISTRY_LC="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "REGISTRY_LC=${REGISTRY_LC}" >> "$GITHUB_ENV"
          docker build -t "${REGISTRY_LC}:${GITHUB_SHA}" -t "${REGISTRY_LC}:latest" .
          docker push "${REGISTRY_LC}:${GITHUB_SHA}"
          docker push "${REGISTRY_LC}:latest"

      - name: Install cosign (native binary, no action)
        if: steps.docker.outputs.skip == '0'
        run: |
          set -Eeuo pipefail
          COSIGN_VERSION="v2.4.1"
          curl -fsSL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version

      - name: Sign image (keyless Fulcio + Rekor)
        if: steps.docker.outputs.skip == '0'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -Eeuo pipefail
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            "${REGISTRY_LC}:${GITHUB_SHA}"

  # =======================================================
  # FINAL VERIFICATION
  # =======================================================
  verify:
    name: Final Verification
    needs:
      - build-test
      - security-scan
      - build-sign
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify required jobs succeeded
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          SECURITY_SCAN: ${{ needs.security-scan.result }}
          BUILD_SIGN: ${{ needs.build-sign.result }}
        run: |
          set -Eeuo pipefail
          echo "build-test=${BUILD_TEST}"
          echo "security-scan=${SECURITY_SCAN}"
          echo "build-sign=${BUILD_SIGN}"
          test "${BUILD_TEST}" = "success"
          test "${SECURITY_SCAN}" = "success"
          if [[ "${{ github.event_name }}" == "release" ]] || \
             [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # build-sign may be skipped (no Dockerfile) — accept success or skipped
            test "${BUILD_SIGN}" = "success" || test "${BUILD_SIGN}" = "skipped"
          fi
          echo "Verification completed successfully."

# =========================================================
# SECURITY HEADERS (enforced by app / reverse proxy)
# =========================================================
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()
#
# =========================================================
# CRYPTOGRAPHIC ROADMAP
# =========================================================
# Implemented / verified: HMAC-SHA3-512
# Planned (not claimed implemented):
#   Argon2id, BLAKE3, ChaCha20-Poly1305,
#   ML-DSA, Falcon, ML-KEM, Merkle audit log, TSA
#
# =========================================================
# IMPORTANT
# =========================================================
# CI success is not production certification.
# PQC signing is not claimed by this workflow.
# Compliance labels are not certification claims.
# Zero third-party actions — org policy compliant.
# =========================================================
