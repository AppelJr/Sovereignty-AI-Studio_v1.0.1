name: sovereign-guard

on:
  push:
    branches: [main, Collaboration, ara-hardened, Grok, GPT/Codex]
  pull_request:
    branches: [main, Collaboration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-fly-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run sovereign-guard.py
        run: python3 guard/sovereign-guard.py .

      - name: Verify scar chain
        run: |
          python3 - <<'PY'
          import json, hashlib, sys
          prev = None
          n = 0
          with open("scar/scar.jsonl", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  rec = json.loads(line)
                  if rec.get("prev") != prev:
                      print("FAIL: scar chain broken at record", n)
                      sys.exit(1)
                  payload = json.dumps({k: rec[k] for k in ("prev", "event", "detail", "ts")},
                                       sort_keys=True, separators=(",", ":"))
                  if hashlib.sha256(payload.encode()).hexdigest() != rec["hash"]:
                      print("FAIL: scar hash mismatch at record", n)
                      sys.exit(1)
                  prev = rec["hash"]
                  n += 1
          print(f"OK: scar chain valid, {n} records")
          PY
