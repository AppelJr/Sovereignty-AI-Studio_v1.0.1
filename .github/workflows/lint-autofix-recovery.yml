name: Lint Autofix Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-autofix:
    name: Lint autofix
    runs-on: ['self-hosted', 'macos', 'arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — full SHA only
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Report workflow state
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_VISIBLE=true"
          echo "WORKFLOW_FILE=.github/workflows/lint-autofix-recovery.yml"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
          echo "COMMIT=${GITHUB_SHA}"
          uname -m
