# OAUTH API GENERATOR - CI/CD PIPELINE
#
# Lean lane: checkout, install cryptography, run the OAuth generator,
# assert artifacts. No third-party actions - native git checkout only,
# matching ci.yml, node.js.yml, python-ci.yml, and ara-hardened-ci.yml.
#
# Provenance: rewritten 2026-10-08 by Grok lane at AppelJr's direction.
# Path fix 2026-10-08: generator lives at scripts/oauth_local_generator.py,
# not .github/workflows/. Run #33 failed on the wrong path.
# Dep fix 2026-10-08: pip install cryptography>=43 before generator step.
# 2026-10-08: removed the ML-DSA import verification step - the generator
# already imports internally and reports the backend in its report.
# 2026-10-08: switched generator to Ed25519 backend (v0.4). ML-DSA-87 and
# liboqs-python removed - neither is installed on ubuntu-latest runners
# (system cryptography 41.0.7 lacks the ml_dsa module), so every run failed
# with exit code 1. Ed25519 has been in cryptography since 2.0.

name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}-lean
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  oauth-generator:
    name: OAuth Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token}}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade "pip>=24" "cryptography>=43"
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Run OAuth generator
        run: |
          set -Eeuo pipefail
          OUT="$(mktemp -d)"
          trap 'rm -rf "${OUT}"' EXIT
          python3 scripts/oauth_local_generator.py --service sovereignty-ai-studio --output-dir "${OUT}"
          test -f "${OUT}/oauth-client.json"
          test -f "${OUT}/oauth-private-key.pem"
          test -f "${OUT}/provenance.json"
          python3 -c "import json; d=json.load(open('${OUT}/oauth-client.json')); assert d['signing_algorithm']=='Ed25519'; assert 'private_key' not in d; assert d['key_reference']=='oauth-private-key.pem'; assert len(d['kid'])==32"
          python3 -c "import json; d=json.load(open('${OUT}/provenance.json')); assert d['event']=='credential_generated'; assert d['algorithm']=='Ed25519'"
          echo "OAuth generator artifacts verified in ${OUT}"
          ls -la "${OUT}"

      - name: Run local OAuth contract validator
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-local-oauth.py
