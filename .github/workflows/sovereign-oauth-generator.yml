# OAUTH API GENERATOR – CI/CD PIPELINE

#
# =========================================================
# OAUTH API GENERATOR – CI/CD PIPELINE
# =========================================================
# CI/CD build, test, and security pipeline
# for AppelJr Sovereignty AI Studio
# =========================================================

name: OAUTH-API-GENERATOR

on:
  push:
    branches: ["main", "Collaboration"]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches: ["main", "Collaboration"]
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/oauth-api-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}-lean
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:

  # =========================================================
  # LINT + TEST (Python)
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.13']

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python ${{ matrix.python}}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python}}

      - name: Install Python dependencies
        run: pip install -r .github/workflows/Requirements.txt

      - name: Run Python tests
        run: pytest -q

      - name: Dependency safety check
        run: safety check -r .github/workflows/Requirements.txt

  # =========================================================
  # NODE CHECK
  # =========================================================
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 25

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Node syntax check
        run: |
          npm run check
          node -c node-bridge/server.js

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          persist-credentials: true

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor}}
          password: ${{ secrets.github_token}}

      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1}}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2}}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3}}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${ !key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          printf '::add-mask::%s' "${SHAMIR_SHARE_1:-}"
          printf '::add-mask::%s' "${SHAMIR_SHARE_2:-}"
          printf '::add-mask::%s' "${SHAMIR_SHARE_3:-}"
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Compute lowercase image name
        run: |
          echo "REGISTRY_LC=ghcr.io/${ GITHUB_REPOSITORY,,}" >> "$ GITHUB_ENV"

      - name: Build Multi-Arch Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env. REGISTRY_LC}}:latest
            ${{ env. REGISTRY_LC}}:${{ github.sha}}

      - name: Install cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3

      - name: Sign Image (Keyless — Fulcio + Rekor)
        run: |
          cosign sign \
            --yes \
            --fulcio-url https://fulcio.sigstore.dev \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env. REGISTRY_LC}}:${{ github.sha}}
        env:
          COSIGN_EXPERIMENTAL: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        continue-on-error: false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        # Advisory only: some repositories do not have dependency graph / GHAS
        # enabled, so this should not block regulated-use CI execution.

  # =========================================================
  # SECURITY SCANNING
  # =========================================================
  security-scan:
    needs: [build-test, node-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: external,frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          hide-progress: false
          exit-code: 1

      - name: OWASP dependency check
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
        continue-on-error: false

# =========================================================
# SECURITY HARDENING HEADERS (enforced in nginx + FastAPI)
# =========================================================
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# X-XSS-Protection: 1; mode=block
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()

# =========================================================
# COMPLIANCE NOTICE (MEDICAL / REGULATED USE)
# =========================================================
# This pipeline adds technical guardrails (linting, tests, dependency review,
# vulnerability scanning, SBOM/provenance generation, and image signing),
# governance, and legal/compliance review for the deployed environment.
# For key custody, use SHAMIR secret-sharing operationally; CI only checks that
# release-share secret inputs are configured and never reconstructs master keys.
# Compliance checks are advisory guards, not certification claims.
 
# https://github.com/Appeljr/Sovereignty-AI-Studio_v1.0.1.git OAuth API Generator
