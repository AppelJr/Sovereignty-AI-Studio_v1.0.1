# OAUTH API GENERATOR — CI/CD PIPELINE
# Sovereign, actionless GitHub Actions workflow for AppelJr.
#
# IMPORTANT:
# - This workflow intentionally contains NO "uses:" steps.
# - The repository policy requires every GitHub Action to be AppelJr-owned
#   and pinned to a full commit SHA. No AppelJr-owned mirrors of the required
#   third-party actions are present, so invoking them would be rejected.
# - Equivalent operations are performed directly on the GitHub-hosted runner.
# - Outbound network access is intentionally preserved for OAuth, package
#   registries, GHCR, Sigstore, and other legitimate external services.

name: OAUTH-API-GENERATOR

on:
  push:
    branches:
      - main
      - Collaboration
      - GPT/Codex
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/sovereign-oauth-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  pull_request:
    branches:
      - main
      - Collaboration
    paths:
      - ".github/workflows/Requirements.txt"
      - ".github/workflows/sovereign-oauth-generator.yml"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements*.txt"
      - "**/*.js"
      - "**/*.py"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHONPATH: .:./backend
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  NODE_VERSION: "25"
  TRIVY_VERSION: "0.75.0"
  COSIGN_VERSION: "3.1.3"

jobs:

  # =========================================================
  # LINT + TEST (Python)
  # =========================================================
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.13"]

    steps:
      - name: Checkout repository without a GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}"             fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Verify Python
        run: |
          command -v python3.13
          python3.13 --version
          python3.13 -m pip --version

      - name: Install Python dependencies
        run: |
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install -r .github/workflows/Requirements.txt
          python3.13 -m pip install flake8 pip-audit safety

      - name: Lint with flake8
        run: |
          python3.13 -m flake8             --count             --select=E9,F63,F7,F82             --show-source             --statistics

      - name: Run Python tests
        run: |
          python3.13 -m pytest             --cov=apps             --cov=backend             --cov=src             --cov-report=term             --strict-markers             -x             --tb=short

      - name: Python dependency audit
        run: |
          python3.13 -m pip_audit -r requirements.txt
          python3.13 -m pip_audit -r .github/workflows/Requirements.txt

  # =========================================================
  # NODE CHECK
  # =========================================================
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository without a GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}"             fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Install Node.js 25 without a GitHub Action
        run: |
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64) NODE_ARCH="x64" ;;
            aarch64|arm64) NODE_ARCH="arm64" ;;
            *) echo "::error::Unsupported runner architecture: ${ARCH}"; exit 1 ;;
          esac

          NODE_VERSION_ACTUAL="$(
            curl --fail --silent --show-error --location               https://nodejs.org/dist/index.json |
              jq -r 'map(select(.version | startswith("v25.")))[0].version'
          )"

          [[ "${NODE_VERSION_ACTUAL}" != "null" && -n "${NODE_VERSION_ACTUAL}" ]]

          curl --fail --silent --show-error --location             "https://nodejs.org/dist/${NODE_VERSION_ACTUAL}/node-${NODE_VERSION_ACTUAL}-linux-${NODE_ARCH}.tar.xz"             --output /tmp/node.tar.xz

          sudo tar -xJf /tmp/node.tar.xz -C /opt
          sudo ln -sfn "/opt/node-${NODE_VERSION_ACTUAL}-linux-${NODE_ARCH}" /opt/node-25
          echo "/opt/node-25/bin" >> "${GITHUB_PATH}"

          node --version
          npm --version

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Node syntax check
        run: |
          npm run check
          node -c node-bridge/server.js

      - name: Node dependency audit
        run: |
          npm audit --audit-level=high

  # =========================================================
  # DOCKER BUILD + MULTI-ARCH + COSIGN SIGNING
  # =========================================================
  build-sign:
    needs: [build-test, node-check]
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Checkout repository without a GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}"             fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Verify Docker Buildx
        run: |
          docker --version
          docker buildx version
          docker buildx create --name sovereign-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GH_TOKEN}" |
            docker login ghcr.io               --username "${GITHUB_ACTOR}"               --password-stdin

      - name: Validate SHAMIR release-share secrets
        if: github.event_name == 'release'
        env:
          SHAMIR_SHARE_1: ${{ secrets.SHAMIR_SHARE_1 }}
          SHAMIR_SHARE_2: ${{ secrets.SHAMIR_SHARE_2 }}
          SHAMIR_SHARE_3: ${{ secrets.SHAMIR_SHARE_3 }}
        run: |
          missing=0
          for key in SHAMIR_SHARE_1 SHAMIR_SHARE_2 SHAMIR_SHARE_3; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          printf '::add-mask::%s\n' "${SHAMIR_SHARE_1:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_2:-}"
          printf '::add-mask::%s\n' "${SHAMIR_SHARE_3:-}"

          (( missing == 0 ))

      - name: Compute lowercase image name
        run: |
          echo "REGISTRY_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Build and push multi-architecture image
        run: |
          docker buildx build             --platform linux/amd64,linux/arm64             --push             --sbom=true             --provenance=mode=max             --tag "${REGISTRY_LC}:latest"             --tag "${REGISTRY_LC}:${GITHUB_SHA}"             .

      - name: Install Cosign without a GitHub Action
        run: |
          go version
          GOBIN="${RUNNER_TEMP}/bin" go install             "github.com/sigstore/cosign/v3/cmd/cosign@v${COSIGN_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/cosign" version

      - name: Sign pushed image by immutable digest
        run: |
          DIGEST="$(
            docker buildx imagetools inspect "${REGISTRY_LC}:${GITHUB_SHA}"               --format '{{.Manifest.Digest}}'
          )"

          [[ "${DIGEST}" == sha256:* ]]

          cosign sign --yes "${REGISTRY_LC}@${DIGEST}"

  # =========================================================
  # DEPENDENCY REVIEW — actionless equivalent
  # =========================================================
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository without a GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}"             fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Review Python dependencies
        run: |
          python3.13 -m pip install --upgrade pip pip-audit
          python3.13 -m pip_audit -r requirements.txt
          python3.13 -m pip_audit -r .github/workflows/Requirements.txt

      - name: Review Node dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

  # =========================================================
  # SECURITY SCANNING
  # =========================================================
  security-scan:
    needs: [build-test, node-check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository without a GitHub Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}"             fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Install Trivy without a GitHub Action
        run: |
          sudo apt-get update
          sudo apt-get install --yes wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key |
            gpg --dearmor |
            sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" |
            sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes trivy
          trivy --version

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs             --severity CRITICAL,HIGH             --ignore-unfixed             --exit-code 1             --no-progress             --skip-dirs external,frontend             .

      - name: OWASP Python dependency audit
        run: |
          python3.13 -m pip install --upgrade pip pip-audit
          python3.13 -m pip_audit -r requirements.txt

# =========================================================
# SECURITY HARDENING HEADERS
# Enforced by nginx + FastAPI at runtime.
# =========================================================
# Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
# Content-Security-Policy: default-src 'self'; script-src 'self'
# X-Content-Type-Options: nosniff
# X-Frame-Options: DENY
# Referrer-Policy: strict-origin-when-cross-origin
# Permissions-Policy: camera=(), microphone=(), geolocation=()

# =========================================================
# COMPLIANCE NOTICE
# =========================================================
# This workflow provides CI guardrails only. It is not a regulatory
# certification. OAuth/network connectivity remains available; this
# workflow does not install an egress firewall or deny third-party APIs.
# SHAMIR release shares are checked for presence only and are never
# reconstructed in CI.
