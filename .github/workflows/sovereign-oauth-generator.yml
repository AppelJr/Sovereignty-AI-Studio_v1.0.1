# OAUTH API GENERATOR – CI/CD PIPELINE
# Lean lane: authenticated source fetch, run the OAuth generator, assert artifacts.
# No third-party GitHub actions. Outbound OAuth/network access remains available.

name: OAUTH-API-GENERATOR

on:
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}-lean
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  oauth-generator:
    name: OAuth Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch exact commit without reinitializing Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/source.tar.gz"
          tar -xzf "${RUNNER_TEMP}/source.tar.gz" --strip-components=1 -C "${GITHUB_WORKSPACE}"
          test -f .github/workflows/oauth_local_generator.py
          printf 'Source commit: %s\n' "${GITHUB_SHA}"

      - name: Verify Python runtime
        run: |
          command -v python3
          python3 --version
          python3 -m pip --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: Run OAuth generator
        run: |
          set -Eeuo pipefail
          OUT="$(mktemp -d)"
          trap 'rm -rf "${OUT}"' EXIT
          python3 .github/workflows/oauth_local_generator.py "${OUT}"
          test -d "${OUT}"
          echo "OAuth generator artifacts written to ${OUT}"
          ls -la "${OUT}"
