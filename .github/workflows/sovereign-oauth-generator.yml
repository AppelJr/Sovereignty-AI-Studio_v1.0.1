name: OAuth Generator

on:
  push:
    branches: [Collaboration]
    paths:
      - 'scripts/oauth_local_generator.py'
      - 'scripts/validate-local-oauth.py'
      - 'config/local-oauth-policy.json'
      - 'tests/test_oauth_local_generator.py'
      - '.github/workflows/sovereign-oauth-generator.yml'
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

concurrency:
  group: oauth-generator-${{ github.ref }}  # concurrency group
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oauth-generator:
    name: OAuth Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --tags --depth=1 origin "${{ github.sha }}:refs/remotes/origin/HEAD"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader || true
          git rev-parse --short HEAD

      - name: Install Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install cryptography
          python3 -m pip install liboqs-python

      - name: Run OAuth Generator (REAL RUN, fail-closed)
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="oauth-ci-artifacts"
          rm -rf "${OUT}"
          mkdir -m 0700 "${OUT}"
          python3 scripts/oauth_local_generator.py --service sovereignty-ai-studio --output-dir "${OUT}"
          test -f "${OUT}/oauth-client.json"
          test -f "${OUT}/oauth-private-key.pem"
          test -f "${OUT}/provenance.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['validation']=='PASS'; assert d['event']=='credential_generated'; assert 'private_key' not in d" "${OUT}/provenance.json"
          python3 -c "import base64; from cryptography.hazmat.primitives import serialization; from cryptography.hazmat.primitives.asymmetric import ml_dsa; k=serialization.load_pem_private_key(open(sys.argv[1],'rb').read(), None); assert isinstance(k, ml_dsa.MLDSA87PrivateKey)" "${OUT}/oauth-private-key.pem"
          echo "OAUTH_REAL_RUN=PASS"
