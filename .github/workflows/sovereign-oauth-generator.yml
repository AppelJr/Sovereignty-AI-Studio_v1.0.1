# OAUTH-API-GENERATOR
#
# Lean lane: checkout, install cryptography, run the OAuth generator,
# assert artifacts. No third-party actions — native git checkout only,
# matching ci.yml, python-ci.yml, and ara-hardened-ci.yml.
#
# Provenance: rewritten 2026-10-08 by Grok lane at AppelJr's direction.
# The previous version of this file was the full CI/CD pipeline
# (build-test, node-check, docker build-sign, trivy, OWASP) with NO
# OAuth generator step at all — which is why runs #61-#65 showed
# startup_failure with total_jobs: 0. The allowlist/SHA-pinning policy
# was never the blocker; the workflow simply had nothing to run.

name: OAUTH-API-GENERATOR

on:
  push:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  workflow_dispatch:

concurrency:
  group: oauth-api-generator-${{ github.ref }}-lean
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oauth-generator:
    name: OAuth Generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token}}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha}}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --upgrade "pip>=24" "cryptography>=43"
          python3 -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Run OAuth generator
        run: |
          set -Eeuo pipefail
          OUT="$(mktemp -d -p /tmp sg-oauth-XXXXXX)"
          trap 'rm -rf "${OUT}"' EXIT
          python3 scripts/oauth_local_generator.py --service sovereignty-ai-studio --output-dir "${OUT}"
          test -f "${OUT}/oauth-client.json"
          test -f "${OUT}/oauth-private-key.pem"
          test -f "${OUT}/provenance.json"
          python3 - "${OUT}/oauth-client.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert "private_key" not in d
          assert d["key_reference"] == "oauth-private-key.pem"
          assert len(d["kid"]) == 32
          PY
          python3 - "${OUT}/provenance.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["event"] == "credential_generated"
          assert d["algorithm"] == "Ed25519"
          PY
          echo "OAuth generator artifacts verified in ${OUT}"
          ls -la "${OUT}"

      - name: Run OAuth contract validator
        run: |
          set -Eeuo pipefail
          python3 scripts/validate-local-oauth.py
