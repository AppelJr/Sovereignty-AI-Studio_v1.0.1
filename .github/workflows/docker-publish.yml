name: Docker

on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, Devassist420]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'diamond-core/**'
      - 'backend/**'
      - 'node-bridge/**'
      - 'agents/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, Devassist420]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'diamond-core/**'
      - 'backend/**'
      - 'node-bridge/**'
      - 'agents/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires the image repository name to be lowercase
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Docker build and contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Normalize image name to lowercase
        shell: bash
        run: |
          set -Eeuo pipefail
          # GHCR repository names must be lowercase
          echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Verify Docker
        run: docker version

      - name: Resolve Diamond Core lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f diamond-core/Cargo.toml
          # diamond-core is a workspace member; Cargo writes Cargo.lock at the workspace root.
          if test -f Cargo.lock; then
            test -s Cargo.lock
          else
            if ! cargo generate-lockfile --manifest-path diamond-core/Cargo.toml; then
              echo 'cargo generate-lockfile returned non-zero; attempting workspace lockfile validation' >&2
            fi
            if test -f Cargo.lock; then
              test -s Cargo.lock
            else
              cargo generate-lockfile --manifest-path diamond-core/Cargo.toml
              test -s Cargo.lock
            fi
          fi
          # Ensure the package-local lockfile exists when Cargo places it under diamond-core/
          if test -f diamond-core/Cargo.lock; then
            test -s diamond-core/Cargo.lock
          fi

      - name: Diamond Core contract gate
        run: cargo test --manifest-path diamond-core/Cargo.toml --all-targets --locked

      - name: Prepare isolated Compose validation fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/compose-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=ci-compose-validation' \
            -keyout "$RUNNER_TEMP/compose-tls/key.pem" \
            -out "$RUNNER_TEMP/compose-tls/cert.pem" \
            2>/dev/null
          test -s "$RUNNER_TEMP/compose-tls/cert.pem"
          test -s "$RUNNER_TEMP/compose-tls/key.pem"

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
          JWT_SECRET: ci-compose-validation-only
          SECRET_KEY: ci-compose-validation-only
          KEYCLOAK_ADMIN_PASSWORD: ci-compose-validation-only
          TLS_CERT: ${{ runner.temp }}/compose-tls/cert.pem
          TLS_KEY: ${{ runner.temp }}/compose-tls/key.pem
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --profile production --profile keycloak config --quiet

      - name: Build image
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${REGISTRY}/${IMAGE_NAME_LC}:${GITHUB_SHA}"
          docker build --tag "$TAG" .
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      # Publishing is owner-gated and production-only. PRs and Collaboration pushes never publish.
      - name: Verify production release authorization manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SOVEREIGN_RELEASE_PUBLISH == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          roadmap = json.loads(Path("roadmap/sovereignty-production-roadmap.json").read_text())
          release = roadmap.get("release", {})
          if release.get("status") != "PRODUCTION":
              raise SystemExit("BLOCKED: release status is not PRODUCTION")
          if release.get("promotion_authorized") is not True:
              raise SystemExit("BLOCKED: promotion_authorized is not true")
          if not isinstance(release.get("owner_acceptance_ref"), str) or not release["owner_acceptance_ref"].strip():
              raise SystemExit("BLOCKED: owner acceptance reference is missing")
          if any(gate.get("mandatory") and gate.get("status") != "PASS" for gate in roadmap.get("production_gates", [])):
              raise SystemExit("BLOCKED: mandatory production gate is not PASS")
          if any(workstream.get("status") != "PASS" for workstream in roadmap.get("workstreams", [])):
              raise SystemExit("BLOCKED: workstream is not PASS")
          print("PASS: release manifest satisfies structural owner-gate requirements")
          PY

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SOVEREIGN_RELEASE_PUBLISH == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${GITHUB_ACTOR}" --password-stdin
          docker push "$IMAGE_TAG"
