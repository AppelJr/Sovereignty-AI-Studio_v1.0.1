name: Docker

on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, Devassist420, gate-wiring]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'diamond-core/**'
      - 'backend/**'
      - 'node-bridge/**'
      - 'agents/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, Devassist420, gate-wiring]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'diamond-core/**'
      - 'backend/**'
      - 'node-bridge/**'
      - 'agents/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires the image repository name to be lowercase
  IMAGE_NAME: ${{ github.repository }

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }
  cancel-in-progress: false

jobs:
  build:
    name: Docker build and contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository at exact commit
        env:
          GH_TOKEN: ${{ github.token }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "${{ github.server_url }}/{{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Normalize image name to lowercase
        shell: bash
        run: |
          set -Eeuo pipefail
          # GHCR repository names must be lowercase
          echo "IMAGE_NAME_LC=${{ github.repository,, }}" >> "${{ github.env }}"

      - name: Verify Docker
        run: docker version

      - name: Resolve Diamond Core lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f diamond-core/Cargo.toml
          # diamond-core is a workspace member; Cargo writes Cargo.lock at the workspace root.
          if test -f Cargo.lock; then
            test -s Cargo.lock
          else
            if ! cargo generate-lockfile --manifest-path diamond-core/Cargo.toml; then
              echo 'cargo generate-lockfile returned non-zero; attempting workspace lockfile validation' >&2
            fi
            if test -f Cargo.lock; then
              test -s Cargo.lock
            else
              cargo generate-lockfile --manifest-path diamond-core/Cargo.toml
              test -s Cargo.lock
            fi
          fi
          # Ensure the package-local lockfile exists when Cargo places it under diamond-core/
          if test -f diamond-core/Cargo.lock; then
            test -s diamond-core/Cargo.lock
          fi

      - name: Diamond Core contract gate
        run: cargo test --manifest-path diamond-core/Cargo.toml --all-targets --locked

      - name: Prepare isolated Compose validation fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${{ runner.temp }}/compose-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=ci-compose-validation' \
            -keyout "${{ runner.temp }}/compose-tls/key.pem" \
            -out "${{ runner.temp }}/compose-tls/cert.pem" \
            2>/dev/null
          test -s "${{ runner.temp }}/compose-tls/cert.pem"
          test -s "${{ runner.temp }}/compose-tls/key.pem"

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
          JWT_SECRET: ci-compose-validation-only
          SECRET_KEY: ci-compose-validation-only
          KEYCLOAK_ADMIN_PASSWORD: ci-compose-validation-only
          TLS_CERT: ${{ runner.temp }}/compose-tls/cert.pem
          TLS_KEY: ${{ runner.temp }}/compose-tls/key.pem
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose --profile production --profile keycloak config --quiet

      - name: Build image
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${{ env.REGISTRY }}/{{ env.IMAGE_NAME_LC }}:{{ github.sha }}"
          docker build --tag "$TAG" .
          echo "IMAGE_TAG=$TAG" >> "${{ github.env }}"

      - name: Publish image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.github_token }
        run: |
          set -Eeuo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker push "${{ env.IMAGE_TAG }}"
