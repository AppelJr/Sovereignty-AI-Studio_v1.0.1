name: CI Startup Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-probe:
    name: CI startup probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — full SHA only
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Hatch — full SHA payload
        shell: bash
        run: |
          set -Eeuo pipefail
          SHA="${{ github.sha }}"
          printf 'FULL_SHA=%s\n' "$SHA"
          LEN=${#SHA}
          printf 'HEAD_SHA_LEN=%s\n' "$LEN"
          test "$LEN" -eq 40
          printf 'HATCH=OPEN\n'
          printf 'PAYLOAD_ENTERED=true\n'
          uname -m
          python3 --version
          echo "RUNNER=${RUNNER_NAME:-none}/${RUNNER_OS:-none}/${RUNNER_ARCH:-none}"
