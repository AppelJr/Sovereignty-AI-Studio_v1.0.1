name: CI Startup Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-probe:
    name: CI startup probe
    runs-on: ubutu-latest
    steps:
      - name: Checkout without external action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Hatch — full SHA payload
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'FULL_SHA=%s\n' "${GITHUB_SHA}"
          printf 'HEAD_SHA_LEN=%s\n' "${#GITHUB_SHA}"
          test "${#GITHUB_SHA}" -eq 40
          printf 'HATCH=OPEN\n'
          printf 'PAYLOAD_ENTERED=true\n'
          uname -m
          python3 --version
          echo "RUNNER=${RUNNER_NAME:-none}/${RUNNER_OS:-none}/${RUNNER_ARCH:-none}"
