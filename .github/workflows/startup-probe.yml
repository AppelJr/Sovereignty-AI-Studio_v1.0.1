name: CI Startup Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-probe:
    name: CI startup probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}  # pin to the triggering SHA, not HEAD of branch
          fetch-depth: 1
      - name: Hatch — full SHA payload
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'FULL_SHA=%s\n' "${{ github.sha }}"
          printf 'HEAD_SHA_LEN=%s\n' "${{ #github.sha }}"
          test "${{ #github.sha }}" -eq 40
          printf 'HATCH=OPEN\n'
          printf 'PAYLOAD_ENTERED=true\n'
          uname -m
          python3 --version
          echo "RUNNER=${RUNNER_NAME:-none}/${RUNNER_OS:-none}/${RUNNER_ARCH:-none}"
