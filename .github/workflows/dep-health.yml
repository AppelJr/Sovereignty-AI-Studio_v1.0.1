name: Dependency Health

on:
  push:
    branches: [main, Collaboration, Claude, ara-hardened, duckAI]
  pull_request:
    branches: [main, Collaboration, Claude, ara-hardened, duckAI]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  python-audit:
    name: Python — CVE audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "$REPO_URL"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Audit requirements.txt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user --upgrade pip pip-audit
          python3 -m pip_audit -r requirements.txt

  python-requirements:
    name: Python — requirements install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "$REPO_URL"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -r requirements.txt

  node-audit:
    name: Node.js — CVE audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "$REPO_URL"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Run npm audit when package.json present
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f node-bridge/package.json ]]; then
            cd node-bridge
            if [[ -f package-lock.json ]]; then
              npm ci --ignore-scripts
            else
              npm install --package-lock-only --ignore-scripts
            fi
            npm audit --audit-level=moderate
          elif [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then
              npm ci --ignore-scripts
            else
              npm install --package-lock-only --ignore-scripts
            fi
            npm audit --audit-level=moderate
          else
            echo 'No package.json found; Node audit is not applicable.'
          fi

  requirements-lint:
    name: Requirements — structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "$REPO_URL"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Validate requirements.txt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('requirements.txt')
          if not path.is_file():
              raise SystemExit('requirements.txt is required but missing')
          for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              if '\t' in line:
                  raise SystemExit(f'{path}:{number}: tab character is not allowed')
          print(f'Validated {path}')
          PY

  summary:
    name: Dependency Health — summary
    if: always()
    needs: [python-audit, python-requirements, node-audit, requirements-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Publish evidence-backed verdict
        shell: bash
        env:
          PYTHON_AUDIT: ${{ needs.python-audit.result }}
          PYTHON_REQUIREMENTS: ${{ needs.python-requirements.result }}
          NODE_AUDIT: ${{ needs.node-audit.result }}
          REQUIREMENTS_LINT: ${{ needs.requirements-lint.result }}
        run: |
          set -Eeuo pipefail
          {
            echo '## Dependency Health'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo "| Python CVE audit | ${PYTHON_AUDIT} |"
            echo "| Python requirements install | ${PYTHON_REQUIREMENTS} |"
            echo "| Node.js CVE audit | ${NODE_AUDIT} |"
            echo "| Requirements structural validation | ${REQUIREMENTS_LINT} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PYTHON_AUDIT" != success || "$PYTHON_REQUIREMENTS" != success || "$NODE_AUDIT" != success || "$REQUIREMENTS_LINT" != success ]]; then
            echo 'Dependency Health FAILED: one or more gates did not pass.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Dependency Health PASSED: all applicable gates completed successfully.' >> "$GITHUB_STEP_SUMMARY"
