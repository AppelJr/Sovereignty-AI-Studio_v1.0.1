name: Flake8 Lint

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420]

permissions:
  contents: read

jobs:
  flake8-recovery:
    name: Flake8 recovery / visible execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a309ff6b9b65696a9512b93b1046f734bb0f7a63 # v5.3.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install flake8
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip flake8
      - name: Run flake8
        shell: bash
        run: |
          set -Eeuo pipefail
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          echo 'Flake8 recovery: PASS (non-blocking for now)'
