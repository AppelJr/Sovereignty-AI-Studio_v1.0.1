name: Flake8 Lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake8-disabled:
    name: Flake8 disabled — use repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled gate
        run: |
          echo 'Flake8 workflow disabled intentionally.'
          echo 'The former recovery job suppressed flake8 failures with || true and reported PASS.'
          echo 'Dependency Health is the active dependency gate.'
