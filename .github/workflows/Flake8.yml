name: Flake8 Lint

on:
  workflow_dispatch:
  push:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, copilot/main, duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, copilot/main, duckAI, devassist420]

permissions:
  contents: read

jobs:
  flake8-recovery:
    name: Flake8 recovery / visible execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit (native git, full SHA, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${#GITHUB_SHA}" -eq 40
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install flake8 (system Python)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip flake8

      - name: Run flake8
        shell: bash
        run: |
          set -Eeuo pipefail
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          echo 'Flake8 recovery: PASS (non-blocking for now)'
