name: Node.js CI

on:
  push:
    branches: [Collaboration]
  pull_request:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
          git rev-parse --short HEAD

      - name: Use system Node.js and run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install
          else
            echo "No package.json — Node job skipped"
            exit 0
          fi
          npm run build --if-present
          npm test --if-present
