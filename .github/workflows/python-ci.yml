name: Python CI

on:
  push:
    branches: [ Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420, gate-wiring ]
  pull_request:
    branches: [ Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420, gate-wiring ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }
  cancel-in-progress: false

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: basic ${auth}" fetch --depth=1 origin "${{ github.sha }}"
          git checkout --detach FETCH_HEAD
          git rev-parse --short HEAD
