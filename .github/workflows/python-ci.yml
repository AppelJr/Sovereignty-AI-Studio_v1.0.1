name: Python CI

on:
  push:
    branches: [ Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420 ]
  pull_request:
    branches: [ Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: basic ${auth}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git rev-parse --short HEAD

      - name: Run offline dispatcher Python unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install pytest pytest-asyncio httpx 'jsonschema>=4.25.1,<5'
          python3 -m pytest -q tests/unit/test_offline_tool_dispatcher.py

      - name: Run local inference fail-closed tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q tests/test_bridge_server.py tests/test_sovereign_api_provider.py

      - name: Run production continuity schema and checkpoint tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_production_continuity.py
          python3 -m pytest -q tests/test_production_continuity.py

      - name: Run focused HeavyJudge and dual-gate tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            backend/coordination/test_dual_gate_path.py \
            tests/test_heavy_judge_gate.py \
            tests/test_judge_composition.py \
            tests/test_smart_provider_router.py \
            tests/test_ai_router_dual_gate.py

      - name: Run owner-gated Node dispatcher integration tests
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm ci --ignore-scripts
          node tests/test_offline_tool_dispatcher_integration.js
