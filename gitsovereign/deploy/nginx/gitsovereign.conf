# GitSovereign — Nginx HTTPS termination.
# Deliberately refuses to masquerade as live until a real domain and certificates exist.

server {
    listen 80;
    server_name YOUR_REAL_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_REAL_DOMAIN;

    ssl_certificate     /etc/gitsovereign/tls/server.crt;
    ssl_certificate_key /etc/gitsovereign/tls/server.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # Enable only after real client certificates and a trusted client CA exist.
    # ssl_client_certificate /etc/gitsovereign/tls/client-ca.pem;
    # ssl_verify_client on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self)" always;

    root /var/www/gitsovereign/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:9897;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
