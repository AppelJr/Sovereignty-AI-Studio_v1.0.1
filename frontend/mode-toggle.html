<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mode Toggle — Sovereignty</title>
<style>
  :root {
    --bg: #0a0e13;
    --card: #111821;
    --line: #243041;
    --text: #edf2f7;
    --muted: #8b9bb0;
    --local: #3dd68c;
    --hybrid: #f0b429;
    --online: #f07178;
    --accent: #5b9fd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .card {
    width: min(380px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.05rem;
  }
  .sub {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .track {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    background: #0c1219;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px;
  }
  .track button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 12px 6px;
    border-radius: 999px;
    cursor: pointer;
  }
  .track button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .track button[aria-pressed="true"][data-mode="LOCAL"] {
    background: rgba(61,214,140,0.18);
    color: var(--local);
  }
  .track button[aria-pressed="true"][data-mode="HYBRID"] {
    background: rgba(240,180,41,0.18);
    color: var(--hybrid);
  }
  .track button[aria-pressed="true"][data-mode="ONLINE"] {
    background: rgba(240,113,120,0.18);
    color: var(--online);
  }
  .status {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #0c1219;
    border: 1px solid var(--line);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.82rem;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.local { background: var(--local); }
  .dot.hybrid { background: var(--hybrid); }
  .dot.online { background: var(--online); }
  .net.off { color: var(--muted); }
  .net.on { color: var(--local); }
  .net.restricted { color: var(--hybrid); }
  .hint {
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.8rem;
    min-height: 2.4em;
  }
  .hosts {
    display: none;
    margin-top: 12px;
  }
  .hosts.show { display: block; }
  .hosts input {
    width: 100%;
    margin-top: 6px;
    border: 1px solid var(--line);
    background: #0c1219;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font: 0.85rem ui-monospace, Menlo, Consolas, monospace;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .row button {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 11px 12px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  #apply {
    background: var(--accent);
    color: #071018;
  }
  #reset {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line) !important;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Runtime mode</h1>
    <p class="sub">LOCAL default · HYBRID hosts required · ONLINE needs ack</p>

    <div class="track" role="radiogroup" aria-label="Runtime mode">
      <button type="button" data-mode="LOCAL" aria-pressed="true">LOCAL</button>
      <button type="button" data-mode="HYBRID" aria-pressed="false">HYBRID</button>
      <button type="button" data-mode="ONLINE" aria-pressed="false">ONLINE</button>
    </div>

    <div class="status">
      <span class="pill"><span class="dot local" id="modeDot"></span><span id="modeText">LOCAL</span></span>
      <span class="net off" id="netText">network off</span>
    </div>

    <div class="hosts" id="hostsWrap">
      <label for="hosts">Allowed hosts</label>
      <input id="hosts" placeholder="127.0.0.1,localhost" autocomplete="off" />
    </div>

    <p class="hint" id="hint">Offline / loopback only.</p>

    <div class="row">
      <button type="button" id="apply">Apply</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </div>

<script>
(function () {
  var KEY = "sovereignty.mode.toggle.v1";
  var pending = "LOCAL";
  var active = "LOCAL";
  var btns = Array.prototype.slice.call(document.querySelectorAll(".track button"));
  var modeDot = document.getElementById("modeDot");
  var modeText = document.getElementById("modeText");
  var netText = document.getElementById("netText");
  var hostsWrap = document.getElementById("hostsWrap");
  var hosts = document.getElementById("hosts");
  var hint = document.getElementById("hint");

  var copy = {
    LOCAL: "Offline / loopback only.",
    HYBRID: "Loopback + explicit hosts. No wildcards.",
    ONLINE: "Owner-authorized remote. Last resort."
  };

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || "{}");
      if (s.mode === "LOCAL" || s.mode === "HYBRID" || s.mode === "ONLINE") {
        active = pending = s.mode;
        if (s.hosts) hosts.value = s.hosts;
      }
    } catch (e) {}
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify({
      mode: active,
      hosts: hosts.value.trim(),
      network: active !== "LOCAL",
      at: new Date().toISOString()
    }));
  }

  function paintPending() {
    btns.forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-mode") === pending ? "true" : "false");
    });
    hostsWrap.classList.toggle("show", pending === "HYBRID");
    hint.textContent = copy[pending] + (pending !== active ? "  · pending apply" : "");
  }

  function paintActive() {
    modeText.textContent = active;
    modeDot.className = "dot " + active.toLowerCase();
    if (active === "LOCAL") {
      netText.className = "net off";
      netText.textContent = "network off";
    } else if (active === "HYBRID") {
      netText.className = "net restricted";
      netText.textContent = navigator.onLine ? "restricted" : "offline";
    } else {
      netText.className = navigator.onLine ? "net on" : "net off";
      netText.textContent = navigator.onLine ? "online" : "unreachable";
    }
  }

  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      pending = b.getAttribute("data-mode");
      paintPending();
    });
  });

  document.getElementById("apply").addEventListener("click", function () {
    if (pending === "HYBRID") {
      var h = hosts.value.trim();
      if (!h) { hint.textContent = "HYBRID needs at least one host."; return; }
      if (h.indexOf("*") !== -1) { hint.textContent = "HYBRID forbids wildcard *."; return; }
    }
    if (pending === "ONLINE") {
      if (!confirm("Authorize ONLINE remote mode?\nNetwork is not authorization.")) {
        hint.textContent = "ONLINE canceled.";
        return;
      }
    }
    active = pending;
    save();
    paintPending();
    paintActive();
    hint.textContent = "Applied " + active + ".";
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "sovereignty.mode", mode: active, hosts: hosts.value.trim() }, "*");
      }
    } catch (e) {}
  });

  document.getElementById("reset").addEventListener("click", function () {
    pending = active = "LOCAL";
    hosts.value = "";
    save();
    paintPending();
    paintActive();
    hint.textContent = "Reset to LOCAL.";
  });

  window.addEventListener("online", paintActive);
  window.addEventListener("offline", paintActive);

  load();
  paintPending();
  paintActive();
})();
</script>
</body>
</html>
