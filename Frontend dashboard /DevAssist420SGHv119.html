<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DevAssist420 — Sovereignty AI Studio</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;background:#07090d;color:#eef2f7}body{margin:0;background:#07090d}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.title{font-size:24px;font-weight:750}.sub{opacity:.65;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{border:1px solid #252b35;border-radius:14px;padding:14px;background:#0d1118}.ok{border-color:#21663c}.bad{border-color:#6b2930}.label{font-size:12px;opacity:.6}.value{margin-top:6px;font-weight:650}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:7px}.dot.ok{background:#36d67a}.dot.bad{background:#e85c68}.chat{border:1px solid #252b35;border-radius:14px;overflow:hidden}.messages{height:48vh;min-height:320px;overflow:auto;padding:16px}.msg{margin:0 0 14px;white-space:pre-wrap;line-height:1.45}.who{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin-bottom:4px}.user .who{color:#8ab4ff}.ai .who{color:#61e294}.system .who{color:#e4b86a}.input{display:flex;gap:8px;padding:10px;border-top:1px solid #252b35}.input textarea{flex:1;resize:none;min-height:52px;border:1px solid #303744;border-radius:10px;background:#090c11;color:#fff;padding:10px;font:inherit}.input button{border:1px solid #4266a8;background:#17315d;color:#fff;border-radius:10px;padding:0 18px;font-weight:700}.meta{font-size:11px;opacity:.55;margin-top:8px}.gate{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55}.warn{color:#f1c66b}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">DevAssist420</div><div class="sub">Sovereignty AI Studio · live control surface</div></div>
    <div class="sub" id="transport">connecting…</div>
  </div>
  <section class="grid" id="services"></section>
  <section class="card gate" id="gate">Gate status: checking…</section>
  <div style="height:12px"></div>
  <section class="chat">
    <div class="messages" id="messages"><div class="msg system"><div class="who">System</div>DevAssist420 is ready. Send a request to the local bridge. Authorization remains outside the chat surface.</div></div>
    <form class="input" id="chatForm"><textarea id="prompt" placeholder="Talk to DevAssist420…" autocomplete="off"></textarea><button>Send</button></form>
  </section>
</div>
<script>
const BRIDGE=`${location.protocol}//${location.hostname}:9899`;
const $=id=>document.getElementById(id);
function add(who,text,cls){const d=document.createElement('div');d.className=`msg ${cls||''}`;d.innerHTML=`<div class="who"></div>`;d.querySelector('.who').textContent=who;d.append(document.createTextNode(String(text)));$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}
async function get(path,opts={}){const r=await fetch(BRIDGE+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}}if(!r.ok)throw new Error(j.error||j.message||`HTTP ${r.status}`);return j}
function service(name,ok,detail){return `<div class="card ${ok?'ok':'bad'}"><div class="label"><span class="dot ${ok?'ok':'bad'}"></span>${name}</div><div class="value">${ok?'AVAILABLE':'UNAVAILABLE'}</div><div class="meta">${detail||''}</div></div>`}
async function status(){try{const [bridge,agents]=await Promise.all([get('/api/bridge/status'),get('/api/agents/status')]);$('transport').textContent=`bridge ${location.hostname}:9899 · ${new Date().toLocaleTimeString()}`;const b=bridge.services||bridge.backends||bridge;const a=agents.agents||agents.services||agents;let items=[];if(typeof b==='object')for(const [k,v] of Object.entries(b).slice(0,8)){const ok=typeof v==='boolean'?v:!!(v&&((v.ok??v.healthy)===true||v.status==='ok'||v.status==='healthy'));items.push(service(k,ok,typeof v==='string'?v:''))}if(!items.length)items=[service('Node bridge',true,'HTTP response received'),service('Agent registry',true,'Response received')];$('services').innerHTML=items.join('');$('gate').innerHTML=`<b>Sovereignty control plane</b><br>Bridge: <span class="warn">reachable</span><br>DevAssist: ${JSON.stringify(a).slice(0,500)}<br><span class="meta">GateOne / GitSovereign admission is not inferred from transport health.</span>`}catch(e){$('transport').textContent='bridge unreachable';$('services').innerHTML=service('Node bridge',false,e.message);$('gate').textContent='Gate status unavailable — fail closed. No model admission is inferred.'}}
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const p=$('prompt').value.trim();if(!p)return;$('prompt').value='';add('You',p,'user');try{const r=await get('/api/chat',{method:'POST',body:JSON.stringify({prompt:p,source:'DevAssist420',request_id:crypto.randomUUID()})});add('DevAssist420',r.result??r.response??r.message??JSON.stringify(r),'ai')}catch(err){add('System',`Request failed safely: ${err.message}`,'system')}});
status();setInterval(status,5000);
</script>
</body>
</html>
