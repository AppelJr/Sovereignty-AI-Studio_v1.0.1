<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DevAssist420 — Sovereignty AI Studio</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#080b10;color:#e8edf5}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0b1018,#06080c)}main{max-width:900px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}.sub{color:#8995a8;font-size:12px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.card{border:1px solid #263040;border-radius:10px;padding:10px;background:#0d121a}.label{font-size:10px;color:#778397;text-transform:uppercase}.value{font-weight:700;margin-top:4px;font-size:13px}.ok{color:#55d98a}.warn{color:#ffc857}.bad{color:#ff6b6b}#chat{height:52vh;min-height:320px;overflow:auto;border:1px solid #263040;border-radius:12px;background:#090d13;padding:12px}.msg{margin:8px 0;padding:10px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#172235}.ai{background:#101923}.sys{background:#241b10;color:#ffc857;font-size:12px}form{display:flex;gap:8px;margin-top:10px}textarea{flex:1;resize:vertical;min-height:52px;max-height:180px;background:#0d121a;color:#fff;border:1px solid #334155;border-radius:10px;padding:11px;font:inherit}button{border:1px solid #3a4658;border-radius:10px;background:#152238;color:#fff;padding:0 18px;font-weight:700}button:disabled{opacity:.45}.owner{display:flex;align-items:center;gap:8px;font-size:12px;color:#aab4c3;margin:10px 0}.receipt{font-size:10px;color:#738197;margin-top:5px;word-break:break-all}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}form{position:sticky;bottom:0;background:#080b10;padding-top:8px}}
</style>
</head>
<body><main>
<section class="top"><div><h1>🛡️ DevAssist420 · Sovereignty AI Studio</h1><div class="sub">Owner-controlled live interface · Gate → Route → Local Inference → SCAR</div></div><div id="overall" class="warn">CHECKING…</div></section>
<section class="grid"><div class="card"><div class="label">Studio</div><div id="studio" class="value">CHECKING</div></div><div class="card"><div class="label">DevAssist</div><div id="devassist" class="value">CHECKING</div></div><div class="card"><div class="label">Python</div><div id="python" class="value">CHECKING</div></div><div class="card"><div class="label">Gate</div><div id="gate" class="value">CHECKING</div></div></section>
<label class="owner"><input id="owner" type="checkbox"> Owner session authenticated — required to authorize a request</label>
<div id="chat" aria-live="polite"><div class="msg sys">Runtime view is live. No request is sent until you submit it.</div></div>
<form id="form"><textarea id="input" placeholder="Talk to DevAssist420…" autocomplete="off"></textarea><button id="send" type="submit">SEND</button></form><div id="receipt" class="receipt"></div>
</main>
<script>
const NODE='http://127.0.0.1:9899',PY='http://127.0.0.1:9897',$=id=>document.getElementById(id);function msg(k,t){const d=document.createElement('div');d.className='msg '+k;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function health(){try{await get(NODE+'/health');$('studio').textContent='ONLINE';$('studio').className='value ok'}catch(e){$('studio').textContent='UNAVAILABLE';$('studio').className='value bad'}try{const d=await get(NODE+'/api/devassist/status');$('devassist').textContent='READY';$('devassist').className='value ok';$('gate').textContent=d.agreement.default_decision;$('gate').className='value warn'}catch(e){$('devassist').textContent='UNAVAILABLE';$('devassist').className='value bad'}try{await get(PY+'/health');$('python').textContent='ONLINE';$('python').className='value ok'}catch(e){$('python').textContent='UNAVAILABLE';$('python').className='value bad'}$('overall').textContent='LOCAL RUNTIME';$('overall').className='ok'}
$('form').addEventListener('submit',async e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;if(!$('owner').checked){msg('sys','REQUIRE_APPROVAL — authenticate the owner session before sending.');return}$('input').value='';msg('user',text);$('send').disabled=true;$('receipt').textContent='Authorizing…';const session=crypto.randomUUID(),request_id=crypto.randomUUID();try{const a=await fetch(NODE+'/api/devassist420/authorize',{method:'POST',headers:{'Content-Type':'application/json','X-Sovereignty-Protocol':'devassist420-v1'},body:JSON.stringify({text,owner_authenticated:true,requester_id:'Appel420',action:'chat',prefer:'local',session_id:session,request_id})}).then(r=>r.json());if(a.state!=='AUTHORIZED'){msg('sys',a.state+' — '+(a.reason||'request not admitted'));$('receipt').textContent=JSON.stringify(a.evidence||{});return}$('receipt').textContent='Gate ALLOW · capability '+a.capability_id;const x=await fetch(NODE+'/api/devassist420/execute',{method:'POST',headers:{'Content-Type':'application/json','X-Sovereignty-Protocol':'devassist420-v1'},body:JSON.stringify({request:{text,requester_id:'Appel420',action:'chat',prefer:'local',session_id:session,request_id},capability_id:a.capability_id,session_id:a.session_id,epoch:a.epoch})}).then(r=>r.json());if(x.state==='EXECUTED'){msg('ai',x.response||'[empty response]');$('receipt').textContent='EXECUTED · SCAR '+((x.evidence&&x.evidence.hash)||'recorded')}else msg('sys',x.state+' — '+(x.reason||'execution failed'))}catch(err){msg('sys','DENY — '+err.message);$('receipt').textContent='No successful execution receipt.'}finally{$('send').disabled=false}});health();setInterval(health,5000);
</script></body></html>
